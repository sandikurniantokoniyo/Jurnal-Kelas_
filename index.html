<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JELAS - Jurnal Harian Guru</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        gold: { 50: '#fbf9f1', 100: '#f5f0d9', 200: '#ebe1b5', 300: '#deca85', 400: '#d1af54', 500: '#c59535', 600: '#ac7528', 700: '#895522', 800: '#724522', 900: '#613a21', 950: '#381f10' },
                        cream: '#FDFBF7',
                        dark: '#121212',
                        darker: '#0a0a0a',
                        darkcard: '#1e1e1e'
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- SheetJS (Excel Export) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <!-- jsPDF & AutoTable (PDF Export) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        /* Custom Styles & Scrollbar */
        body { -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        /* Gold Gradient Text */
        .text-gradient-gold {
            background: linear-gradient(135deg, #c59535 0%, #d1af54 50%, #ac7528 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(30, 30, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 22s linear infinite;
        }
        .animate-marquee:hover {
            animation-play-state: paused;
        }
    </style>
</head>
<body class="bg-cream text-slate-800 dark:bg-darker dark:text-slate-200 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, createContext, useContext, useRef, useCallback } = React;

        
        // --- INITIAL MOCK DATA ---
        const initialData = {
            appSettings: {
                appTitle: "JELAS",
                appSubtitle: "JURNAL GURU FASE D",
                schoolName: "MTs Negeri 2 Kabupaten Gorontalo",
                logo: ""
            },
            kopSettings: {
                line1: "KEMENTERIAN AGAMA REPUBLIK INDONESIA",
                line2: "KANTOR KEMENTERIAN AGAMA KABUPATEN GORONTALO",
                line3: "MADRASAH TSANAWIYAH NEGERI 2 KABUPATEN GORONTALO",
                address: "Jl. Ahmad A. Wahab No. 123, Limboto, Kab. Gorontalo",
                contact: "Email: mtsn2gorontalo@kemenag.go.id | Telp: (0435) 881234",
                fontFamily: "helvetica",
                fontSizeLine1: 11,
                fontSizeLine2: 12,
                fontSizeLine3: 14,
                fontSizeAddress: 8.5,
                logoLeft: "",
                logoRight: "",
                showLogoLeft: true,
                showLogoRight: true,
                showLogo: true
            },
            teacher: {
                name: "Sandi Kurnianto Koniyo, S.Pd",
                nip: "19850101 201001 1 001", // Fake NIP for visual
                school: "MTs Negeri 2 Kabupaten Gorontalo",
                phase: "D",
                academicYear: "2026/2027",
                photo: "https://placehold.co/150x150/c59535/ffffff?text=SK",
                headmasterName: "Drs. H. Abd. Rahman, M.Pd",
                headmasterNip: "19710515 199703 1 002"
            },
            classes: [
                { id: 'c1', name: 'VII-A', studentCount: 32 },
                { id: 'c2', name: 'VII-B', studentCount: 30 },
                { id: 'c3', name: 'VII-C', studentCount: 31 },
                { id: 'c4', name: 'VII-D', studentCount: 32 },
                { id: 'c5', name: 'VII-E', studentCount: 29 },
                { id: 'c6', name: 'VII-F', studentCount: 30 },
                { id: 'c7', name: 'VII-G', studentCount: 31 },
            ],
            subjects: ["Bahasa Indonesia", "Matematika", "IPA", "IPS", "Bahasa Inggris", "Pendidikan Agama Islam", "PJOK"],
            materials: [
                { id: 'm1', subject: 'Bahasa Indonesia', chapter: 'Teks Deskripsi', title: 'Menelaah Struktur Teks Deskripsi' },
                { id: 'm2', subject: 'Bahasa Indonesia', chapter: 'Teks Narasi', title: 'Unsur Intrinsik Cerita Fantasi' },
            ],
            students: [],
            journals: [],
            attendance: []
        };

        // Generate fake students
        const generateStudents = () => {
            let students = [];
            let idCounter = 1;
            initialData.classes.forEach(cls => {
                for(let i=0; i<5; i++) { // Generate 5 per class for demo
                    students.push({
                        id: `s${idCounter++}`,
                        nis: `2026${String(idCounter).padStart(3, '0')}`,
                        name: `Siswa Contoh ${idCounter} (${cls.name})`,
                        gender: i % 2 === 0 ? 'L' : 'P',
                        classId: cls.id,
                        className: cls.name
                    });
                }
            });
            return students;
        };
        initialData.students = generateStudents();

        // --- DATABASE SERVICE (LocalStorage Wrapper) ---
        const DB = {
            init: () => {
                if (!localStorage.getItem('jelas_data')) {
                    localStorage.setItem('jelas_data', JSON.stringify(initialData));
                }
            },
            get: () => JSON.parse(localStorage.getItem('jelas_data')),
            set: (data) => localStorage.setItem('jelas_data', JSON.stringify(data)),
            saveJournal: (journal) => {
                const data = DB.get();
                if(journal.id) {
                    const idx = data.journals.findIndex(j => j.id === journal.id);
                    if(idx !== -1) data.journals[idx] = journal;
                } else {
                    journal.id = 'j_' + Date.now();
                    data.journals.unshift(journal); // Add to top
                }
                DB.set(data);
                return journal;
            },
            deleteJournal: (id) => {
                const data = DB.get();
                data.journals = data.journals.filter(j => j.id !== id);
                DB.set(data);
            },
            saveAttendance: (date, classId, records) => {
                const data = DB.get();
                // Remove existing for this date and class
                data.attendance = data.attendance.filter(a => !(a.date === date && a.classId === classId));
                data.attendance.push({ id: 'a_'+Date.now(), date, classId, records });
                DB.set(data);
            },
            saveAppSettings: (settings) => {
                const data = DB.get();
                data.appSettings = settings;
                DB.set(data);
            },
            saveKopSettings: (kop) => {
                const data = DB.get();
                data.kopSettings = kop;
                DB.set(data);
            },
            saveTeacher: (teacherData) => {
                const data = DB.get();
                data.teacher = teacherData;
                DB.set(data);
            },
            saveClass: (cls) => {
                const data = DB.get();
                if(cls.id) {
                    const idx = data.classes.findIndex(c => c.id === cls.id);
                    if(idx !== -1) data.classes[idx] = cls;
                } else {
                    cls.id = 'c_' + Date.now();
                    data.classes.push(cls);
                }
                DB.set(data);
            },
            deleteClass: (id) => {
                const data = DB.get();
                data.classes = data.classes.filter(c => c.id !== id);
                DB.set(data);
            },
            importStudents: (newStudents) => {
                const data = DB.get();
                data.students = [...data.students, ...newStudents];
                DB.set(data);
            }
        };
        DB.init();


        // --- UTILS ---
        const formatDate = (dateStr) => {
            if(!dateStr) return '';
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        };

        const getTodayStr = () => {
            const today = new Date();
            // Format YYYY-MM-DD for inputs
            return today.toISOString().split('T')[0];
        };

        // --- CONTEXT ---
        const AppContext = createContext();

        const AppProvider = ({ children }) => {
            const [data, setData] = useState(() => {
                const dbData = DB.get();
                // Backward compatibility untuk data lama
                if (!dbData.appSettings) {
                    dbData.appSettings = {
                        appTitle: "JELAS",
                        appSubtitle: "JURNAL GURU FASE D",
                        schoolName: "MTs Negeri 2 Kabupaten Gorontalo",
                        logo: ""
                    };
                }
                if (!dbData.kopSettings) {
                    dbData.kopSettings = {
                        line1: "KEMENTERIAN AGAMA REPUBLIK INDONESIA",
                        line2: "KANTOR KEMENTERIAN AGAMA KABUPATEN GORONTALO",
                        line3: "MADRASAH TSANAWIYAH NEGERI 2 KABUPATEN GORONTALO",
                        address: "Jl. Ahmad A. Wahab No. 123, Limboto, Kab. Gorontalo",
                        contact: "Email: mtsn2gorontalo@kemenag.go.id | Telp: (0435) 881234",
                        logoLeft: "",
                        logoRight: "",
                        showLogoLeft: true,
                        showLogoRight: true,
                        showLogo: true
                    };
                }
                if (dbData.kopSettings.showLogoLeft === undefined) {
                    dbData.kopSettings.showLogoLeft = true;
                    dbData.kopSettings.showLogoRight = true;
                    dbData.kopSettings.logoLeft = dbData.kopSettings.logoLeft || dbData.appSettings?.logo || "";
                    dbData.kopSettings.logoRight = dbData.kopSettings.logoRight || "";
                }
                if (dbData.kopSettings.fontFamily === undefined) {
                    dbData.kopSettings.fontFamily = "helvetica";
                    dbData.kopSettings.fontSizeLine1 = 11;
                    dbData.kopSettings.fontSizeLine2 = 12;
                    dbData.kopSettings.fontSizeLine3 = 14;
                    dbData.kopSettings.fontSizeAddress = 8.5;
                }
                if (!dbData.teacher.headmasterName) {
                    dbData.teacher.headmasterName = "Drs. H. Abd. Rahman, M.Pd";
                    dbData.teacher.headmasterNip = "19710515 199703 1 002";
                }
                DB.set(dbData);
                return dbData;
            });
            const [user, setUser] = useState(null); // null if not logged in
            const [theme, setTheme] = useState(localStorage.getItem('theme') || 'light');
            const [currentView, setCurrentView] = useState('dashboard');
            const [toast, setToast] = useState(null);

            useEffect(() => {
                document.documentElement.className = theme;
                localStorage.setItem('theme', theme);
            }, [theme]);

            const refreshData = () => setData(DB.get());

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');

            return (
                <AppContext.Provider value={{ 
                    data, refreshData, 
                    user, setUser, 
                    theme, toggleTheme,
                    currentView, setCurrentView,
                    showToast
                }}>
                    {children}
                    {toast && (
                        <div className={`fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white font-medium z-50 animate-fade-in flex items-center gap-2 ${toast.type === 'success' ? 'bg-green-600' : 'bg-red-600'}`}>
                            <i className={`ph-fill ${toast.type === 'success' ? 'ph-check-circle' : 'ph-warning-circle'} text-xl`}></i>
                            {toast.message}
                        </div>
                    )}
                </AppContext.Provider>
            );
        };


        // --- UI COMPONENTS ---
        const Card = ({ children, className = "" }) => (
            <div className={`bg-white dark:bg-darkcard rounded-xl shadow-sm border border-slate-100 dark:border-slate-800 p-6 ${className}`}>
                {children}
            </div>
        );

        const Button = ({ children, variant = 'primary', icon, onClick, className = "", type="button" }) => {
            const baseStyle = "inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 dark:focus:ring-offset-darker";
            const variants = {
                primary: "bg-gold-500 hover:bg-gold-600 text-white shadow-md shadow-gold-500/20 focus:ring-gold-500",
                secondary: "bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-800 dark:hover:bg-slate-700 dark:text-slate-200 focus:ring-slate-500",
                danger: "bg-red-50 hover:bg-red-100 text-red-600 dark:bg-red-900/20 dark:hover:bg-red-900/40 dark:text-red-400 focus:ring-red-500",
                ghost: "hover:bg-slate-100 text-slate-600 dark:hover:bg-slate-800 dark:text-slate-300"
            };
            return (
                <button type={type} onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {icon && <i className={`ph ${icon} text-lg`}></i>}
                    {children}
                </button>
            );
        };

        const Input = ({ label, type = "text", ...props }) => (
            <div className="mb-4">
                {label && <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">{label}</label>}
                <input 
                    type={type} 
                    className="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-darkcard text-slate-900 dark:text-white focus:ring-2 focus:ring-gold-500 focus:border-transparent transition-colors outline-none"
                    {...props}
                />
            </div>
        );

        const Select = ({ label, options, ...props }) => (
            <div className="mb-4">
                {label && <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">{label}</label>}
                <select 
                    className="w-full px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-darkcard text-slate-900 dark:text-white focus:ring-2 focus:ring-gold-500 focus:border-transparent transition-colors outline-none"
                    {...props}
                >
                    <option value="">-- Pilih --</option>
                    {options.map((opt, i) => (
                        <option key={i} value={opt.value || opt}>{opt.label || opt}</option>
                    ))}
                </select>
            </div>
        );

        const Badge = ({ status }) => {
            const styles = {
                'Terlaksana': 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400',
                'Sebagian Terlaksana': 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400',
                'Tidak Terlaksana': 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400',
            };
            const style = styles[status] || 'bg-slate-100 text-slate-700';
            return <span className={`px-2.5 py-1 text-xs font-semibold rounded-full ${style}`}>{status}</span>;
        };


        // --- LAYOUT COMPONENTS ---
        const Sidebar = ({ isOpen, setIsOpen }) => {
            const { currentView, setCurrentView, user, setUser, data } = useContext(AppContext);

            const menus = [
                { title: 'DASHBOARD', items: [{ id: 'dashboard', label: 'Dashboard', icon: 'ph-squares-four' }] },
                { title: 'JURNAL HARIAN', items: [
                    { id: 'jurnal_list', label: 'Semua Jurnal', icon: 'ph-book-open-text' },
                    { id: 'jurnal_form', label: 'Tambah Jurnal', icon: 'ph-plus-circle' },
                ]},
                { title: 'AKADEMIK & KEHADIRAN', items: [
                    { id: 'presensi', label: 'Presensi Siswa', icon: 'ph-calendar-check' },
                    { id: 'kelas', label: 'Data Kelas', icon: 'ph-blackboard' },
                    { id: 'siswa', label: 'Data Siswa', icon: 'ph-users' },
                ]},
                { title: 'PENGATURAN', items: [
                    { id: 'settings', label: 'Pengaturan & Export', icon: 'ph-gear' },
                ]}
            ];

            const navItemClass = (id) => `flex items-center gap-3 px-4 py-3 rounded-lg cursor-pointer transition-colors mb-1 ${currentView === id ? 'bg-gold-500 text-white shadow-md shadow-gold-500/20' : 'text-slate-600 hover:bg-gold-50 dark:text-slate-400 dark:hover:bg-slate-800 hover:text-gold-600 dark:hover:text-gold-400'}`;

            return (
                <>
                    {/* Mobile overlay */}
                    {isOpen && <div className="fixed inset-0 bg-black/50 z-40 lg:hidden" onClick={() => setIsOpen(false)}></div>}
                    
                    <aside className={`fixed inset-y-0 left-0 z-50 w-64 bg-white dark:bg-darkcard border-r border-slate-200 dark:border-slate-800 transform transition-transform duration-300 ease-in-out lg:translate-x-0 overflow-y-auto ${isOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-6 pb-4 border-b border-slate-100 dark:border-slate-800 sticky top-0 bg-white dark:bg-darkcard z-10">
                            <div className="flex items-center gap-3">
                                {data.appSettings?.logo ? (
                                    <img src={data.appSettings.logo} alt="Logo" className="w-10 h-10 rounded-xl object-cover shadow-lg shadow-gold-500/30 bg-white" />
                                ) : (
                                    <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-gold-500/30">
                                        {data.appSettings?.appTitle?.charAt(0) || 'J'}
                                    </div>
                                )}
                                <div>
                                    <h1 className="font-display font-bold text-xl tracking-tight text-slate-800 dark:text-white">{data.appSettings?.appTitle || 'JELAS'}</h1>
                                    <p className="text-[10px] text-slate-500 font-medium tracking-wide">{data.appSettings?.appSubtitle || 'JURNAL GURU FASE D'}</p>
                                </div>
                            </div>
                        </div>

                        <div className="p-4">
                            {menus.map((section, idx) => (
                                <div key={idx} className="mb-6">
                                    <p className="px-4 text-xs font-semibold text-slate-400 dark:text-slate-500 mb-2 tracking-wider">{section.title}</p>
                                    {section.items.map(item => (
                                        <div 
                                            key={item.id} 
                                            className={navItemClass(item.id)}
                                            onClick={() => { setCurrentView(item.id); setIsOpen(false); }}
                                        >
                                            <i className={`ph ${item.icon} text-xl ${currentView === item.id ? '' : 'text-slate-400 dark:text-slate-500'}`}></i>
                                            <span className="font-medium text-sm">{item.label}</span>
                                        </div>
                                    ))}
                                </div>
                            ))}
                        </div>

                        <div className="p-4 border-t border-slate-100 dark:border-slate-800">
                            <div 
                                className="flex items-center gap-3 px-4 py-3 rounded-lg cursor-pointer text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors"
                                onClick={() => setUser(null)}
                            >
                                <i className="ph ph-sign-out text-xl"></i>
                                <span className="font-medium text-sm">Logout</span>
                            </div>
                        </div>
                    </aside>
                </>
            );
        };

        const Header = ({ toggleSidebar }) => {
            const { data, theme, toggleTheme } = useContext(AppContext);
            const today = formatDate(new Date().toISOString());

            return (
                <header className="sticky top-0 z-30 bg-white/80 dark:bg-darkcard/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 h-16 flex items-center justify-between px-4 lg:px-8">
                    <div className="flex items-center gap-3 md:gap-4">
                        <button onClick={toggleSidebar} className="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 active:scale-95 transition-transform" aria-label="Menu">
                            <i className="ph ph-list text-2xl"></i>
                        </button>
                        <div className="flex items-center gap-2 text-xs md:text-sm text-slate-600 dark:text-slate-300 font-medium">
                            <i className="ph ph-calendar-blank text-gold-500 text-base"></i>
                            <span className="truncate">{today}</span>
                        </div>
                    </div>

                    <div className="flex items-center gap-3 md:gap-4">
                        <button onClick={toggleTheme} className="p-2 rounded-full text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800 transition-colors" title="Beralih Tema">
                            <i className={`ph ${theme === 'dark' ? 'ph-sun text-yellow-400' : 'ph-moon'} text-xl`}></i>
                        </button>
                        
                        <div className="flex items-center gap-2 md:gap-3 pl-3 md:pl-4 border-l border-slate-200 dark:border-slate-700">
                            <div className="hidden sm:block text-right">
                                <p className="text-xs md:text-sm font-semibold text-slate-800 dark:text-white leading-tight">{data.teacher.name.split(',')[0]}</p>
                                <p className="text-[11px] text-slate-500">Guru {data.teacher.phase}</p>
                            </div>
                            <img src={data.teacher.photo} alt="Profile" className="w-8 h-8 md:w-9 md:h-9 rounded-full object-cover border-2 border-gold-400 shadow-sm" />
                        </div>
                    </div>
                </header>
            );
        };


        // --- VIEWS ---
        const ViewLogin = () => {
            const { setUser, data } = useContext(AppContext);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                // Simulate login
                setUser({ role: 'guru', name: 'Sandi Kurnianto Koniyo, S.Pd' });
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-gold-50 relative overflow-hidden">
                    {/* Decorative elements */}
                    <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-gold-300 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob"></div>
                    <div className="absolute top-[20%] right-[-10%] w-96 h-96 bg-yellow-200 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-blob animation-delay-2000"></div>

            const handleSubmit = (e) => {
                e.preventDefault();
                DB.saveClass({ ...formData, studentCount: Number(formData.studentCount) || 0 });
                refreshData();
                showToast("Data kelas berhasil disimpan");
                setIsEditing(false);
                setFormData({ id: '', name: '', studentCount: 0 });
            };

            const handleEdit = (cls) => {
                setFormData(cls);
                setIsEditing(true);
            };

            const handleDelete = (id) => {
                if(confirm('Yakin ingin menghapus kelas ini? Pastikan tidak ada data siswa yang terkait pada kelas ini.')) {
                    DB.deleteClass(id);
                    refreshData();
                    showToast("Kelas berhasil dihapus");
                }
            };

            return (
                <div className="animate-fade-in space-y-4">
                    <h2 className="text-2xl font-bold">Data Kelas</h2>
                    
                    <div className="grid md:grid-cols-3 gap-6">
                        <div className="md:col-span-1">
                            <Card>
                                <h3 className="font-bold text-lg mb-4 pb-2 border-b border-slate-100 dark:border-slate-800">
                                    <i className={`ph ${isEditing ? 'ph-pencil-simple' : 'ph-plus-circle'} mr-2`}></i>
                                    {isEditing ? 'Edit Kelas' : 'Tambah Kelas'}
                                </h3>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <Input label="Nama Kelas" placeholder="Contoh: VII-A" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} required />
                                    <div className="flex gap-2 pt-2">
                                        <Button type="submit" className="w-full justify-center">{isEditing ? 'Update' : 'Simpan'}</Button>
                                        {isEditing && <Button variant="ghost" onClick={() => {setIsEditing(false); setFormData({id:'', name:'', studentCount:0})}}>Batal</Button>}
                                    </div>
                                </form>
                            </Card>
                        </div>
                        <div className="md:col-span-2">
                            <Card className="!p-0 overflow-hidden">
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-700">
                                            <tr>
                                                <th className="px-6 py-4 font-medium">Nama Kelas</th>
                                                <th className="px-6 py-4 font-medium">Jumlah Siswa</th>
                                                <th className="px-6 py-4 font-medium text-right">Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                            {data.classes.map(c => {
                                                const actualCount = data.students.filter(s => s.classId === c.id).length;
                                                return (
                                                <tr key={c.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                                    <td className="px-6 py-4 font-medium">{c.name}</td>
                                                    <td className="px-6 py-4">
                                                        <span className="bg-blue-50 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400 py-1 px-3 rounded-full text-xs font-semibold">
                                                            {actualCount} Siswa
                                                        </span>
                                                    </td>
                                                    <td className="px-6 py-4 text-right space-x-2">
                                                        <button onClick={() => handleEdit(c)} className="p-1.5 text-blue-600 hover:bg-blue-50 rounded" title="Edit"><i className="ph ph-pencil-simple text-lg"></i></button>
                                                        <button onClick={() => handleDelete(c.id)} className="p-1.5 text-red-600 hover:bg-red-50 rounded" title="Hapus"><i className="ph ph-trash text-lg"></i></button>
                                                    </td>
                                                </tr>
                                            )})}
                                        </tbody>
                                    </table>
                                </div>
                            </Card>
                        </div>
                    </div>
                </div>
            );
        };

        const ViewSiswa = () => {
            const { data, showToast, refreshData } = useContext(AppContext);
            const [selectedClass, setSelectedClass] = useState('');
            
            const handleImport = (e) => {
                const file = e.target.files[0];
                if(!file) return;
                
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, {type:'binary'});
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const importedData = XLSX.utils.sheet_to_json(ws);
                        
                        let idCounter = Date.now();
                        const newStudents = importedData.map(row => {
                            // Coba cocokkan nama kelas dari file excel ke database kelas
                            const classNameStr = row['Kelas'] || row['kelas'] || '';
                            const classObj = data.classes.find(c => c.name.toLowerCase() === String(classNameStr).toLowerCase());
                            const finalClassId = classObj ? classObj.id : data.classes[0].id;
                            const finalClassName = classObj ? classObj.name : data.classes[0].name;

                            return {
                                id: 's' + (idCounter++),
                                nis: row['NIS'] || row['nis'] || '-',
                                name: row['Nama'] || row['nama'] || row['Nama Siswa'] || 'Tanpa Nama',
                                gender: row['L/P'] || row['LP'] || row['Gender'] || 'L',
                                classId: finalClassId,
                                className: finalClassName
                            };
                        });

                        DB.importStudents(newStudents);
                        refreshData();
                        showToast(`Berhasil mengimpor ${newStudents.length} siswa`);
                    } catch (error) {
                        showToast('Gagal membaca file Excel. Pastikan format benar.', 'error');
                        console.error(error);
                    }
                };
                reader.readAsBinaryString(file);
                // Reset file input
                e.target.value = null;
            };

            const downloadTemplate = () => {
                const ws = XLSX.utils.json_to_sheet([{ NIS: '12345', Nama: 'Budi Santoso', Kelas: 'VII-A', 'L/P': 'L' }]);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Template Siswa");
                XLSX.writeFile(wb, "Template_Import_Siswa.xlsx");
            };

            const handleDeleteSiswa = (id) => {
                if(confirm('Hapus siswa ini dari sistem?')) {
                    const currentData = DB.get();
                    currentData.students = currentData.students.filter(stud => stud.id !== id);
                    DB.set(currentData);
                    refreshData();
                    showToast('Data siswa berhasil dihapus');
                }
            };

            const displayedStudents = selectedClass ? data.students.filter(s => s.classId === selectedClass) : data.students;

            return (
                <div className="animate-fade-in space-y-4">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold">Data Siswa</h2>
                            <p className="text-slate-500 text-sm">Kelola data siswa, Anda dapat mengimpor data masal menggunakan format Excel.</p>
                        </div>
                        <div className="flex gap-2">
                            <Button variant="secondary" icon="ph-download-simple" onClick={downloadTemplate}>Template Excel</Button>
                            <label className="cursor-pointer inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg font-medium transition-all duration-200 bg-gold-500 hover:bg-gold-600 text-white shadow-md shadow-gold-500/20 focus:outline-none">
                                <i className="ph ph-upload-simple text-lg"></i>
                                Import Excel
                                <input type="file" accept=".xlsx, .xls, .csv" onChange={handleImport} className="hidden" />
                            </label>
                        </div>
                    </div>

                    <Card className="flex gap-4 items-center bg-slate-50 dark:bg-slate-800/30">
                        <div className="w-full md:w-1/3">
                            <Select label="Filter Kelas" value={selectedClass} onChange={e => setSelectedClass(e.target.value)} options={data.classes.map(c => ({value: c.id, label: c.name}))} />
                        </div>
                        {selectedClass && (
                            <div className="w-full md:w-1/3 pt-4">
                                <p className="text-sm font-semibold text-slate-700 dark:text-slate-300">Total: {displayedStudents.length} Siswa</p>
                            </div>
                        )}
                    </Card>

                    <Card className="!p-0 overflow-x-auto">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-700">
                                <tr>
                                    <th className="px-6 py-4 w-12 font-medium">No</th>
                                    <th className="px-6 py-4 font-medium">NIS</th>
                                    <th className="px-6 py-4 font-medium">Nama Lengkap</th>
                                    <th className="px-6 py-4 font-medium">Kelas</th>
                                    <th className="px-6 py-4 font-medium">L/P</th>
                                    <th className="px-6 py-4 font-medium text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                {displayedStudents.length === 0 ? (
                                    <tr><td colSpan="6" className="px-6 py-8 text-center text-slate-500">Belum ada data siswa pada kelas ini. Silakan import dari Excel.</td></tr>
                                ) : (
                                    displayedStudents.map((s, idx) => (
                                        <tr key={s.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                            <td className="px-6 py-3 text-center">{idx + 1}</td>
                                            <td className="px-6 py-3 font-mono text-xs text-slate-500">{s.nis}</td>
                                            <td className="px-6 py-3 font-medium">{s.name}</td>
                                            <td className="px-6 py-3"><Badge status={s.className} /></td>
                                            <td className="px-6 py-3">{s.gender}</td>
                                            <td className="px-6 py-3 text-right">
                                                <button onClick={() => handleDeleteSiswa(s.id)} className="p-1.5 text-red-600 hover:bg-red-50 rounded" title="Hapus Siswa"><i className="ph ph-trash text-lg"></i></button>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </Card>
                </div>
            )
        };



        // --- MAIN APP ---
        const MainApp = () => {
            const { user, currentView } = useContext(AppContext);
            const [sidebarOpen, setSidebarOpen] = useState(false);

            if (!user) {
                return <ViewLogin />;
            }

            const renderView = () => {
                switch(currentView) {
                    case 'dashboard': return <ViewDashboard />;
                    case 'jurnal_list': return <ViewJurnalList />;
                    case 'jurnal_form': return <ViewJurnalForm />;
                    case 'presensi': return <ViewPresensi />;
                    case 'settings': return <ViewSettings />;
                    case 'siswa': return <ViewSiswa />;
                    case 'kelas': return <ViewKelas />;
                    default: return <ViewDashboard />;
                }
            };

            return (
                <div className="flex h-screen overflow-hidden bg-slate-50/50 dark:bg-darker">
                    <Sidebar isOpen={sidebarOpen} setIsOpen={setSidebarOpen} />
                    
                    <div className="flex-1 flex flex-col min-w-0 overflow-hidden lg:ml-64">
                        <Header toggleSidebar={() => setSidebarOpen(!sidebarOpen)} />
                        
                        <main className="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8">
                            <div className="max-w-7xl mx-auto pb-12">
                                {renderView()}
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <AppProvider>
                <MainApp />
            </AppProvider>
        );
    </script>
</body>
</html>
